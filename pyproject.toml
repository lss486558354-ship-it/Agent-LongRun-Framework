[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-longrun-framework"
version = "0.1.0"
description = "Couple an agent execution state machine with MCP memory routing for interruptible long-running tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "lss486558354-ship-it" },
]
keywords = ["agent", "mcp", "state-machine", "memory", "long-running"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/lss486558354-ship-it/Agent-LongRun-Framework"
Source = "https://github.com/lss486558354-ship-it/Agent-LongRun-Framework"

[tool.setuptools]
py-modules = ["state_machine", "memory_client", "workflow_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".longrun", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
